    - ID: "39e9ab13-eadf-4124-af4d-9548e257d0a2"
      Hint: Bio
      Value: |
        <div class="ck-content"><p>With years of experience in dermatology, Dr. Aline Moreau is committed to helping patients achieve healthy, radiant skin. She provides medical, surgical, and cosmetic care, emphasizing treatments that address both immediate concerns and long-term skin wellness. Her approach is centered on understanding the unique needs of each patient, offering guidance that blends clinical knowledge with a focus on overall confidence and well-being. Dr. Moreau believes in the power of preventive care as much as treatment, ensuring patients feel empowered to maintain their skin health. She also participates in ongoing education and professional collaboration, continually refining her skills to deliver the most effective dermatological solutions.</p></div>
